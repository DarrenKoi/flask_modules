[uwsgi]
; ── entry point ─────────────────────────────────
module = api:create_app()

; ── workers ─────────────────────────────────────
master = true
processes = 4
threads = 2

; ── allocator settings for pandas/Arrow tasks ───
; pyarrow's bundled jemalloc reserves a huge virtual address range at first
; use; under constrained / fragmented worker memory it fails with
; "cannot create default memory pool". Forcing the system allocator
; (plain malloc) bypasses jemalloc init entirely.
env = ARROW_DEFAULT_MEMORY_POOL=system
; glibc gives every thread its own malloc arena (default = 8 * CPU count);
; with multiple uWSGI worker threads doing pandas work the VM footprint
; balloons and competes with Arrow's address-space reservation. Cap to 2.
env = MALLOC_ARENA_MAX=2

; CRITICAL for APScheduler:
;   lazy-apps forks BEFORE importing the app, so each worker
;   gets its own scheduler thread + its own Redis connection
;   pool. Without it, APScheduler threads die on fork and
;   connection pools get shared across workers (corruption).
lazy-apps = true

; Required so Python threads (BackgroundScheduler under
; Flask-APScheduler) actually run.
enable-threads = true

; ── networking ──────────────────────────────────
http = 0.0.0.0:8000

; ── zero-downtime restart ───────────────────────
; `touch /project/workSpace/restart.txt` reloads all workers
; gracefully — your only mechanism for picking up code changes
; from inside the cloud env. Also touched daily at 1 AM by the
; restart_uwsgi scheduled job for memory refresh.
touch-reload = /project/workSpace/restart.txt

; ── memory hygiene ──────────────────────────────
max-requests = 1000              ; recycle worker after N requests
max-worker-lifetime = 3600       ; recycle worker after N seconds
; 1500 MB leaves real headroom for a pandas/Arrow task: a moderate DataFrame
; round-trip easily transits 600-800 MB. At 512 MB the worker was entering
; recycle mid-task, fragmenting memory for the next Arrow init.
reload-on-rss = 1500             ; recycle if RSS exceeds 1500 MB
harakiri = 60                    ; kill any single request stuck >60s
vacuum = true                    ; clean up sockets/pidfiles on exit
