[uwsgi]
; ── entry point ─────────────────────────────────
module = api:create_app()

; ── workers ─────────────────────────────────────
master = true
processes = 4
threads = 2

; CRITICAL for APScheduler:
;   lazy-apps forks BEFORE importing the app, so each worker
;   gets its own scheduler thread + its own Redis connection
;   pool. Without it, APScheduler threads die on fork and
;   connection pools get shared across workers (corruption).
lazy-apps = true

; Required so Python threads (BackgroundScheduler under
; Flask-APScheduler) actually run.
enable-threads = true

; ── networking ──────────────────────────────────
http = 0.0.0.0:8000

; ── zero-downtime restart ───────────────────────
; `touch /project/workSpace/restart.txt` reloads all workers
; gracefully — your only mechanism for picking up code changes
; from inside the cloud env. Also touched daily at 1 AM by the
; restart_uwsgi scheduled job for memory refresh.
touch-reload = /project/workSpace/restart.txt

; ── memory hygiene ──────────────────────────────
max-requests = 1000              ; recycle worker after N requests
max-worker-lifetime = 3600       ; recycle worker after N seconds
reload-on-rss = 512              ; recycle if RSS exceeds 512 MB
harakiri = 60                    ; kill any single request stuck >60s
vacuum = true                    ; clean up sockets/pidfiles on exit
