<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>API scheduler dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    h3 { margin: 1.5rem 0 0.25rem; display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    h3 .job-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1rem; background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
    h3 .job-summary { font-size: 0.85rem; color: #666; font-weight: normal; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; }
    .ok { background: #d4edda; color: #155724; }
    .bad { background: #f8d7da; color: #721c24; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.25rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; }
    th { background: #f4f4f4; }
    .event-start { color: #555; }
    .event-end { color: #155724; }
    .event-skip { color: #856404; }
    .event-error { color: #721c24; font-weight: 600; }
    .event-missed { color: #4527a0; font-weight: 600; }
    .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 0.75rem; margin-right: 4px; }
    .pill-error { background: #f8d7da; color: #721c24; }
    .pill-skip { background: #fff3cd; color: #856404; }
    .pill-end { background: #d4edda; color: #155724; }
    .pill-start { background: #e2e3e5; color: #383d41; }
    .pill-missed { background: #e7defa; color: #4527a0; }
    code { background: #f4f4f4; padding: 1px 4px; border-radius: 3px; }
    small { color: #666; }
    .controls { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.9rem; }
    .controls select { padding: 4px 8px; font: inherit; }
    .empty { color: #777; font-style: italic; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <h1>API scheduler</h1>
  <p>Registered jobs: {% for j in jobs %}<code>{{ j }}</code>{% if not loop.last %}, {% endif %}{% endfor %}</p>
  <p>Health: <span id="health-badge" class="badge">checking…</span> <small id="health-detail"></small></p>
  <p><small>Heartbeat: <span id="heartbeat">—</span> · Role: <span id="role">—</span></small></p>

  <h2>Next runs</h2>
  <div id="next-runs"><p class="empty">loading…</p></div>

  <h2>Recent task runs</h2>
  <div class="controls">
    <label for="event-filter">Event:</label>
    <select id="event-filter">
      <option value="all">All events</option>
      <option value="problems">Problems (error + skip + missed)</option>
      <option value="error">Errors only</option>
      <option value="skip">Skips only</option>
      <option value="missed">Missed (dropped fires)</option>
      <option value="end">Completed (end)</option>
      <option value="start">Started</option>
    </select>
    <label for="age-filter">Age:</label>
    <select id="age-filter">
      <option value="3600">last 1h</option>
      <option value="21600">last 6h</option>
      <option value="86400">last 24h</option>
      <option value="604800">last 7d</option>
      <option value="">all</option>
    </select>
    <label for="job-filter">Job:</label>
    <select id="job-filter">
      <option value="all">all jobs</option>
      {% for j in jobs %}<option value="{{ j }}">{{ j }}</option>{% endfor %}
    </select>
    <small id="filter-count"></small>
  </div>
  <div id="logs-container"><p class="empty">loading…</p></div>

  <script>
    async function refreshHealth() {
      try {
        const r = await fetch('/health');
        const j = await r.json();
        const badge = document.getElementById('health-badge');
        badge.textContent = j.status;
        badge.className = 'badge ' + (j.status === 'ok' ? 'ok' : 'bad');
        document.getElementById('health-detail').textContent =
          `redis=${j.redis} · scheduler=${j.scheduler.running ? 'running' : 'stopped'} · jobs=${j.scheduler.jobs.join(',') || 'none'}`;
        const hb = j.scheduler.heartbeat;
        document.getElementById('heartbeat').textContent =
          hb ? `${toKst(hb)} (${Math.round((Date.now() - Date.parse(hb)) / 1000)}s ago)` : 'missing';
        document.getElementById('role').textContent = j.scheduler.role || '—';
        renderNextRuns(j.scheduler.next_runs || {});
      } catch (e) {
        const badge = document.getElementById('health-badge');
        badge.textContent = 'unreachable';
        badge.className = 'badge bad';
      }
    }

    // The snapshot is written by the scheduler worker from the Redis
    // JOBSTORE, so this is the schedule actually in effect — which can
    // differ from schedule.py's registry until the next deploy boot.
    // The key shares the heartbeat's TTL: a dead scheduler shows "missing".
    function renderNextRuns(nextRuns) {
      const container = document.getElementById('next-runs');
      const entries = Object.entries(nextRuns);
      if (!entries.length) {
        container.innerHTML = '<p class="empty">no snapshot — scheduler heartbeat missing or stale</p>';
        return;
      }
      const fireTime = iso => iso === null ? Infinity : Date.parse(iso);
      entries.sort(([, a], [, b]) => fireTime(a) - fireTime(b));  // paused sink
      const rows = entries.map(([job, iso]) => {
        let eta = '—';
        if (iso) {
          const ms = Date.parse(iso) - Date.now();
          // Slightly negative is normal (the snapshot is up to one
          // heartbeat_interval old); a large lag means a stalled scheduler.
          if (ms < -120000) eta = `<span class="event-error">overdue ${fmtDur(-ms)}</span>`;
          else if (ms < 0) eta = 'due now';
          else eta = `in ${fmtDur(ms)}`;
        }
        return `
            <tr>
              <td><code>${escapeHtml(job)}</code></td>
              <td>${iso ? escapeHtml(toKst(iso)) : '<em>paused</em>'}</td>
              <td>${eta}</td>
            </tr>`;
      }).join('');
      container.innerHTML = `
        <table>
          <thead><tr><th>Job</th><th>Next fire (KST)</th><th>In</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    let lastRecords = [];
    const eventEl = document.getElementById('event-filter');
    const ageEl = document.getElementById('age-filter');
    const jobEl = document.getElementById('job-filter');

    eventEl.value = localStorage.getItem('apiDashEventFilter') || 'problems';
    const savedAge = localStorage.getItem('apiDashAgeFilter');
    ageEl.value = savedAge === null ? '86400' : savedAge;
    let desiredJob = localStorage.getItem('apiDashJobFilter') || 'all';
    if ([...jobEl.options].some(o => o.value === desiredJob)) {
      jobEl.value = desiredJob;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // Records carry UTC ISO timestamps; display in KST for operators here.
    function toKst(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString('sv-SE', { timeZone: 'Asia/Seoul', hour12: false });
    }

    // Durations and ETAs in one human unit: seconds under 90s, minutes
    // under 90min, hours beyond.
    function fmtDur(ms) {
      const s = ms / 1000;
      if (s < 90) return `${Math.round(s)}s`;
      if (s < 5400) return `${(s / 60).toFixed(1)}m`;
      return `${(s / 3600).toFixed(1)}h`;
    }

    // Detail column. Records carry structured extras, not pre-formatted
    // prose, so timestamps in them go through toKst like every other one.
    // A skip names the lock holder: another host/pid means real cross-process
    // contention (manual dispatch, a second scheduler during a reload); a
    // holder whose pid is gone and held_since well in the past is an orphan
    // left by a killed process.
    function detailFor(rec) {
      if (rec.error) return rec.error;
      if (rec.event === 'skip') {
        if (!rec.holder) return 'lock held';
        return `lock held by ${rec.holder} since ${toKst(rec.held_since)}`
             + ` (${rec.ttl_remaining}s ttl left)`;
      }
      if (rec.event === 'missed') {
        return (rec.reason ?? 'run dropped')
             + (rec.scheduled ? ` — scheduled ${toKst(rec.scheduled)}` : '');
      }
      return rec.message ?? '';
    }

    const PROBLEM_EVENTS = new Set(['error', 'skip', 'missed']);

    function matchesEvent(rec, mode) {
      if (mode === 'all') return true;
      if (mode === 'problems') return PROBLEM_EVENTS.has(rec.event);
      return rec.event === mode;
    }

    function mergeUnknownJobs(records) {
      const known = new Set([...jobEl.options].map(o => o.value));
      const seen = [...new Set(records.map(r => r.job))]
        .filter(j => j && !known.has(j))
        .sort();
      for (const j of seen) {
        const opt = document.createElement('option');
        opt.value = j;
        opt.textContent = j + ' (orphan)';
        jobEl.appendChild(opt);
      }
      jobEl.value = [...jobEl.options].some(o => o.value === desiredJob)
        ? desiredJob
        : 'all';
    }

    function summaryPills(records) {
      const counts = { start: 0, end: 0, skip: 0, error: 0, missed: 0 };
      for (const r of records) {
        if (counts[r.event] !== undefined) counts[r.event]++;
      }
      const pills = [];
      if (counts.error) pills.push(`<span class="pill pill-error">${counts.error} error</span>`);
      if (counts.missed) pills.push(`<span class="pill pill-missed">${counts.missed} missed</span>`);
      if (counts.skip) pills.push(`<span class="pill pill-skip">${counts.skip} skip</span>`);
      if (counts.end) pills.push(`<span class="pill pill-end">${counts.end} ok</span>`);
      if (counts.start) pills.push(`<span class="pill pill-start">${counts.start} start</span>`);
      return pills.join('') || '<span class="pill pill-start">—</span>';
    }

    // Feeds the by-hand minute placement: avg/max measured off the same
    // records the table shows, no separate tooling needed.
    function durationSummary(ds) {
      if (!ds.length) return '';
      const avg = ds.reduce((a, b) => a + b, 0) / ds.length;
      return ` · avg ${fmtDur(avg)} · max ${fmtDur(Math.max(...ds))}`;
    }

    // A start with nothing after it is the one signature of a process dying
    // mid-run (which is also what strands locks). Records arrive newest
    // first, so records[0] being a start means "no end/error/skip yet".
    // Escalate once the run is out longer than twice the worst measured
    // duration — only when measurements exist in the window, so a narrow
    // age filter that hides a job's end records cannot fake an alarm.
    function runningBadge(records, ds) {
      const newest = records[0];
      if (!newest || newest.event !== 'start') return '';
      const age = Date.now() - Date.parse(newest.ts);
      if (isNaN(age)) return '';
      const worst = Math.max(...ds, 0);
      return worst && age > 2 * worst
        ? `<span class="pill pill-error">running ${fmtDur(age)} — no end record</span>`
        : `<span class="pill pill-start">running ${fmtDur(age)}</span>`;
    }

    function renderJobSection(job, records) {
      const ds = records
        .filter(r => r.event === 'end' && r.duration_ms != null)
        .map(r => r.duration_ms);
      const eventMode = eventEl.value;
      const filtered = records.filter(r => matchesEvent(r, eventMode));
      const total = records.length;
      const rows = filtered.length
        ? filtered.map(rec => `
            <tr>
              <td>${escapeHtml(toKst(rec.ts))}</td>
              <td class="event-${escapeHtml(rec.event)}">${escapeHtml(rec.event)}</td>
              <td>${rec.duration_ms != null ? (rec.duration_ms / 1000).toFixed(1) : ''}</td>
              <td>${escapeHtml(detailFor(rec))}</td>
            </tr>`).join('')
        : `<tr><td colspan="4"><em class="empty">no records match the event filter</em></td></tr>`;
      return `
        <section>
          <h3>
            <span class="job-name">${escapeHtml(job)}</span>
            <span class="job-summary">${total} run${total === 1 ? '' : 's'} · ${summaryPills(records)}${runningBadge(records, ds)}${durationSummary(ds)}</span>
          </h3>
          <table>
            <thead><tr><th>Time (KST)</th><th>Event</th><th>Duration (s)</th><th>Detail</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </section>`;
    }

    function renderLogs() {
      const container = document.getElementById('logs-container');
      const countEl = document.getElementById('filter-count');

      if (!lastRecords.length) {
        container.innerHTML = '<p class="empty">no runs in selected window</p>';
        countEl.textContent = '';
        return;
      }

      const selectedJob = jobEl.value;
      const visibleRecords = selectedJob === 'all'
        ? lastRecords
        : lastRecords.filter(r => r.job === selectedJob);

      const eventFiltered = visibleRecords.filter(r => matchesEvent(r, eventEl.value));
      countEl.textContent = `showing ${eventFiltered.length} of ${visibleRecords.length}`;

      const grouped = new Map();
      for (const r of visibleRecords) {
        if (!grouped.has(r.job)) grouped.set(r.job, []);
        grouped.get(r.job).push(r);
      }

      if (!grouped.size) {
        container.innerHTML = '<p class="empty">no records for this job in the selected window</p>';
        return;
      }

      // Trouble floats to the top: jobs with a problem in the window come
      // first (newest problem first), healthy jobs follow by recency —
      // alphabetical only breaks ties. Records are newest-first, so
      // find() returns the latest matching record. Keys are computed once
      // per section, not per comparison.
      const sections = [...grouped.entries()]
        .map(([job, recs]) => {
          const problem = recs.find(r => PROBLEM_EVENTS.has(r.event));
          return {
            job,
            recs,
            prob: problem ? 1 : 0,
            ts: Date.parse((problem ?? recs[0]).ts) || 0,
          };
        })
        .sort((a, b) => (b.prob - a.prob) || (b.ts - a.ts) || a.job.localeCompare(b.job))
        .map(({ job, recs }) => renderJobSection(job, recs));
      container.innerHTML = sections.join('');
    }

    eventEl.addEventListener('change', () => {
      localStorage.setItem('apiDashEventFilter', eventEl.value);
      renderLogs();
    });
    jobEl.addEventListener('change', () => {
      desiredJob = jobEl.value;
      localStorage.setItem('apiDashJobFilter', desiredJob);
      renderLogs();
    });
    ageEl.addEventListener('change', () => {
      localStorage.setItem('apiDashAgeFilter', ageEl.value);
      refreshLogs();
    });

    async function refreshLogs() {
      try {
        // No limit: the server serves its whole retained list (log_list_max).
        // A hardcoded number here silently truncated the wider age windows.
        const params = new URLSearchParams();
        if (ageEl.value) params.set('max_age_seconds', ageEl.value);
        const r = await fetch('/jobs/logs?' + params.toString());
        lastRecords = await r.json();
        mergeUnknownJobs(lastRecords);
        renderLogs();
      } catch (e) { /* leave previous render */ }
    }
    function tick() { refreshHealth(); refreshLogs(); }
    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
